<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App matching admin</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 18px; max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.2rem; margin: 0 0 12px; }
    form { display: flex; gap: 8px; }
    input, button { height: 48px; font-size: 1rem; border-radius: 8px; }
    input { flex: 1; min-width: 0; padding: 0 12px; border: 1px solid #ccc; }
    button { padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; margin: 0 0 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
    #message { margin: 16px 0; }
    .error { color: #b00020; white-space: pre-line; }
    [hidden] { display: none !important; }
    section { margin: 24px 0; padding: 16px; border: 1px solid #ccc; border-radius: 12px; }
    #panel { border: 2px solid #1c7ed6; background: #e7f5ff; }
    #panel p { margin: 0 0 12px; }
    #toggle { width: 100%; height: 56px; font-size: 1.1rem; font-weight: 600; color: #fff; background: #1c7ed6; border: none; }
    .state { padding: 2px 10px; border-radius: 8px; color: #fff; }
    .state.on { background: #2b8a3e; }
    .state.off { background: #b00020; }
    #files { display: grid; gap: 8px; }
    #files input[type=file] { height: auto; padding: 8px 0; border: none; }
    #files label { margin-top: 16px; }
    #danger { margin-top: 48px; border-color: #b00020; }
    #reset { width: 100%; background: #b00020; color: #fff; border: none; }
    footer { margin-top: 32px; font-size: 0.8rem; color: #777; }
  </style>
</head>
<body>
  <h1>App matching — admin</h1>

  <form id="login">
    <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" required>
    <button type="submit">Refresh</button>
  </form>

  <p id="message"></p>

  <div id="admin" hidden>
    <section id="panel">
      <p>Participant page: <strong class="state" id="panel-state"></strong></p>
      <button type="button" id="toggle"></button>
    </section>

    <section id="files">
      <h2>Files</h2>
      <button type="button" id="download">Download user entries</button>
      <label for="assignments">Assignments file (CSV: session_id,da,ia)</label>
      <input type="file" id="assignments" accept=".csv,text/csv">
      <button type="button" id="upload">Upload assignments</button>
    </section>

    <section>
      <h2>Statistics</h2>
      <table>
        <tbody id="summary"></tbody>
      </table>
      <table>
        <thead><tr><th>Label</th><th class="num">Average rank</th><th class="num">Ranked first</th></tr></thead>
        <tbody id="labels"></tbody>
      </table>
      <details>
        <summary>Raw payload</summary>
        <pre id="raw"></pre>
      </details>
    </section>

    <section id="danger">
      <h2>Reset</h2>
      <p>Removes all answers, sessions and assignments (they are archived on the server).</p>
      <button type="button" id="reset">Reset all answers</button>
    </section>
  </div>

  <footer id="version"></footer>

  <script src="config.js"></script>
  <script>
    const message = document.getElementById("message");
    let active = false;

    function show(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    function rows(tbody, data) {
      document.getElementById(tbody).innerHTML = data
        .map(cells => "<tr>" + cells.map((c, i) => `<td class="${i ? "num" : ""}">${c}</td>`).join("") + "</tr>")
        .join("");
    }

    function errorText(detail, fallback) {
      if (!Array.isArray(detail)) return detail || fallback;
      return detail.map(d => typeof d === "string" ? d : d.msg).join("\n");
    }

    function password() {
      const value = document.getElementById("password").value;
      if (!value) show("Type the admin password first.", true);
      return value;
    }

    document.getElementById("toggle").onclick = async () => {
      if (!password()) return;
      if (active && !confirm("Close the participant page?\n"
        + "Participants won't be able to answer anymore. The result page keeps working.")) return;
      try {
        const res = await fetch(`${API_URL}/server/${active ? "deactivate" : "activate"}`, {
          method: "POST",
          headers: { "X-Admin-Password": password() },
        });
        const data = await res.json();
        if (!res.ok) return show(errorText(data.detail, "Request failed."), true);
        await refresh();
        show(data.active ? "The participant page is now open." : "The participant page is now closed.");
      } catch {
        show("The server cannot be reached.", true);
      }
    };

    document.getElementById("download").onclick = async () => {
      if (!password()) return;
      try {
        const res = await fetch(`${API_URL}/server/export`, { headers: { "X-Admin-Password": password() } });
        if (!res.ok) return show(errorText((await res.json()).detail, "Download failed."), true);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(await res.blob());
        link.download = "submissions.csv";
        link.click();
        URL.revokeObjectURL(link.href);
        show("Downloaded submissions.csv");
      } catch {
        show("The server cannot be reached.", true);
      }
    };

    document.getElementById("upload").onclick = async () => {
      if (!password()) return;
      const file = document.getElementById("assignments").files[0];
      if (!file) return show("Choose a CSV file first.", true);
      try {
        const res = await fetch(`${API_URL}/server/assignments`, {
          method: "POST",
          headers: { "X-Admin-Password": password(), "Content-Type": "text/csv" },
          body: file,
        });
        const data = await res.json();
        if (!res.ok) return show("File refused:\n" + errorText(data.detail, "Upload failed."), true);
        await refresh();
        show(`Assignments uploaded for ${data.assigned} sessions.`);
      } catch {
        show("The server cannot be reached.", true);
      }
    };

    document.getElementById("reset").onclick = async () => {
      if (!password()) return;
      if (!confirm("This will remove all answers, sessions and assignments.\n"
        + "They are moved to an archive on the server, not deleted.\n\nReset everything?")) return;
      try {
        const res = await fetch(`${API_URL}/server/reset`, {
          method: "POST",
          headers: { "X-Admin-Password": password() },
        });
        const data = await res.json();
        if (!res.ok) return show(errorText(data.detail, "Reset failed."), true);
        await refresh();
        show("All answers, sessions and assignments have been reset (archived on the server).");
      } catch {
        show("The server cannot be reached.", true);
      }
    };

    document.getElementById("login").addEventListener("submit", (event) => {
      event.preventDefault();
      refresh();
    });

    async function refresh() {
      show("Loading…");
      try {
        const res = await fetch(`${API_URL}/server/statistics`, {
          headers: { "X-Admin-Password": document.getElementById("password").value },
        });
        document.getElementById("version").textContent = "Version " + (res.headers.get("X-App-Version") || "?");
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("admin").hidden = true;
          return show(errorText(data.detail, "Request failed."), true);
        }
        active = data.active;
        const state = document.getElementById("panel-state");
        state.textContent = active ? "open" : "closed";
        state.className = "state " + (active ? "on" : "off");
        document.getElementById("toggle").textContent = active ? "Close the participant page" : "Open the participant page";
        rows("summary", [
          ["Sessions started", data.total_sessions],
          ["Submissions", data.total_submissions],
          ["Kept the initial order", data.kept_initial_order],
          ["Assignments uploaded", data.assignments_uploaded ? "yes" : "no"],
        ]);
        rows("labels", Object.keys(data.average_rank_by_label).map(label => [
          label, data.average_rank_by_label[label].toFixed(2), data.ranked_first_count[label],
        ]));
        document.getElementById("raw").textContent = JSON.stringify(data, null, 2);
        document.getElementById("admin").hidden = false;
        show("Updated at " + new Date().toLocaleTimeString());
      } catch {
        show("The server cannot be reached.", true);
      }
    }
  </script>
</body>
</html>
