<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App matching result</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 18px; max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; }
    input, button { display: block; box-sizing: border-box; width: 100%; height: 56px; font-size: 1rem;
                    border-radius: 10px; margin-top: 8px; }
    input { padding: 0 12px; border: 1px solid #ccc; font-family: ui-monospace, monospace; }
    h2 { font-size: 1.2rem; margin: 24px 0 8px; }
    #matches p { margin: 12px 0; }
    #matches strong { font-size: 1.4rem; }
    ol { padding: 0; list-style: none; margin: 0; }
    .item { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
            padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; }
    .item > b { font-size: 1.2rem; text-align: center; color: #888; }
    .item .label { display: block; font-weight: 600; margin-bottom: 6px; }
    .item .facts { display: flex; flex-wrap: wrap; gap: 6px; }
    .item .fact { padding: 4px 10px; border-radius: 8px; font-size: 0.95rem; background: #eef1f5; color: #222; }
    .item .fact strong { font-size: 1.25rem; }
    .item .fact.seats { background: #ffd43b; }
    #message { margin: 16px 0; }
    .error { color: #b00020; }
    footer { margin-top: 32px; font-size: 0.8rem; color: #777; }
  </style>
</head>
<body>
  <h1>My result</h1>

  <form id="lookup">
    <label for="session">Type your session id</label>
    <input id="session" required autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="20" placeholder="e.g. K7QXM3PA">
    <button type="submit">See my matches</button>
  </form>

  <p id="message"></p>
  <div id="result" hidden>
    <h2>Your matches</h2>
    <div id="matches">
      <p>Match under DA: <strong id="da"></strong></p>
      <p>Match under IA: <strong id="ia"></strong></p>
    </div>
    <p id="no-matches"></p>
    <div id="ranking">
      <h2>Your ranking</h2>
      <ol id="items"></ol>
    </div>
  </div>

  <footer id="version"></footer>

  <script src="config.js"></script>
  <script>
    const message = document.getElementById("message");
    const input = document.getElementById("session");
    const result = document.getElementById("result");

    function show(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    input.value = new URLSearchParams(location.search).get("session") || "";

    document.getElementById("lookup").addEventListener("submit", async (event) => {
      event.preventDefault();
      result.hidden = true;
      show("Loading…");
      try {
        const res = await fetch(`${API_URL}/session/assignment/${encodeURIComponent(input.value.trim())}`);
        document.getElementById("version").textContent = "Version " + (res.headers.get("X-App-Version") || "?");
        const data = await res.json();
        if (!res.ok) return show(data.detail || "Request failed.", true);
        const matches = document.getElementById("matches");
        const noMatches = document.getElementById("no-matches");
        matches.hidden = !data.matches;
        noMatches.hidden = !!data.matches;
        if (data.matches) {
          document.getElementById("da").textContent = data.matches.da;
          document.getElementById("ia").textContent = data.matches.ia;
        } else {
          noMatches.textContent = data.results_available
            ? "No course is assigned to this session id."
            : "Results are not available yet.";
        }
        document.getElementById("ranking").hidden = !data.items;
        document.getElementById("items").innerHTML = (data.items || []).map((item, i) =>
          `<li class="item"><b>${i + 1}</b><div><span class="label">${item.label}</span>`
          + `<div class="facts"><span class="fact seats"><strong>${item.seats}%</strong> available seats</span>`
          + `<span class="fact">you have <strong>${item.points}</strong> points</span></div></div></li>`
        ).join("");
        result.hidden = false;
        show("");
      } catch {
        show("The server cannot be reached.", true);
      }
    });
  </script>
</body>
</html>
