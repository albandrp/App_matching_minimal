<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App matching</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 18px; max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; }
    ol { padding: 0; list-style: none; }
    .item { display: grid; grid-template-columns: 32px 1fr auto 56px 56px; gap: 8px; align-items: center;
            padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; }
    .item b { font-size: 1.2rem; text-align: center; }
    .item .score { color: #555; }
    .item button { height: 56px; font-size: 1.4rem; border-radius: 8px; }
    #submit { width: 100%; height: 60px; font-size: 1.2rem; border-radius: 10px; margin-top: 8px; }
    #message { margin: 16px 0; }
    .error { color: #b00020; }
    footer { margin-top: 32px; font-size: 0.8rem; color: #777; line-height: 1.6; word-break: break-all; }
  </style>
</head>
<body>
  <h1>App matching</h1>
  <p id="message">Loading…</p>

  <form id="panel" hidden>
    <p>Rank the topics by preference: move your favourite to the top with ↑ / ↓.</p>
    <ol id="items"></ol>
    <button type="submit" id="submit">Submit</button>
  </form>

  <footer>
    <div id="session"></div>
    <div id="version"></div>
  </footer>

  <script>
    const API_URL = "http://localhost:8000";
    const message = document.getElementById("message");
    const panel = document.getElementById("panel");
    const list = document.getElementById("items");
    let sessionId, items = [];

    // FastAPI puts a string in `detail`, or a list of {msg, ...} for validation errors
    async function errorText(res, fallback) {
      const { detail } = await res.json();
      return Array.isArray(detail) ? detail.map(d => d.msg).join("; ") : detail || fallback;
    }

    function show(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    // every API response carries the app version in a header
    function showVersion(res) {
      document.getElementById("version").textContent = "Version " + (res.headers.get("X-App-Version") || "?");
    }

    const pct = score => Math.round(score * 100) + "%";

    function move(i, delta) {
      [items[i], items[i + delta]] = [items[i + delta], items[i]];
      render();
    }

    function render() {
      list.innerHTML = "";
      items.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "item";
        li.innerHTML = `<b>${i + 1}</b><span>${item.label}</span><span class="score">${pct(item.score)}</span>`
          + `<button type="button" aria-label="Move up">↑</button><button type="button" aria-label="Move down">↓</button>`;
        const [up, down] = li.querySelectorAll("button");
        up.disabled = i === 0;
        down.disabled = i === items.length - 1;
        up.onclick = () => move(i, -1);
        down.onclick = () => move(i, 1);
        list.appendChild(li);
      });
    }

    async function init() {
      try {
        // No status route in the spec: session/start itself is how you find
        // out whether the panel is active (it 403s while inactive).
        const res = await fetch(`${API_URL}/session/start`, { method: "POST" });
        showVersion(res);
        if (res.status === 403) return show("The panel is not active at the moment.");
        if (!res.ok) return show(await errorText(res, "Could not start a session."), true);
        const session = await res.json();
        sessionId = session.session_id;
        items = session.items; // already sorted by score
        document.getElementById("session").textContent = "Session " + sessionId;
        render();
        show("");
        panel.hidden = false;
      } catch {
        show("The server cannot be reached.", true);
      }
    }

    panel.addEventListener("submit", async (event) => {
      event.preventDefault();
      const order = items.map((item, i) => `${i + 1}. ${item.label} (${pct(item.score)})`).join("\n");
      if (!confirm(`Submit this ranking? This cannot be undone.\n\n${order}`)) return;
      try {
        const res = await fetch(`${API_URL}/session/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, items }),
        });
        if (!res.ok) return show(await errorText(res, "Submission failed."), true);
        panel.hidden = true;
        show("Thank you, your answers have been recorded.");
      } catch {
        show("The server cannot be reached.", true);
      }
    });

    init();
  </script>
</body>
</html>
