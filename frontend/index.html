<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App matching</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 18px; max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; }
    ol { padding: 0; list-style: none; }
    .item { display: grid; grid-template-columns: 28px 1fr 44px; gap: 10px; align-items: center;
            padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; }
    .item > b { font-size: 1.2rem; text-align: center; }
    .item .label { display: block; font-weight: 600; margin-bottom: 4px; }
    .item .fact { display: block; font-size: 1rem; line-height: 1.5; }
    .item .fact strong { font-size: 1.3rem; }
    .item .arrows { display: flex; flex-direction: column; gap: 6px; }
    .item button { height: 40px; font-size: 1.1rem; border-radius: 8px; padding: 0; }
    #submit, #copy, #done a { display: block; box-sizing: border-box; width: 100%; height: 60px; font-size: 1.2rem;
                              border-radius: 10px; margin-top: 8px; }
    #done a { line-height: 60px; text-align: center; border: 1px solid #ccc; color: inherit; text-decoration: none; }
    #done code { display: block; padding: 12px; background: #f4f4f4; border-radius: 8px; font-size: 1rem; word-break: break-all; }
    #message { margin: 16px 0; }
    .error { color: #b00020; }
    footer { margin-top: 32px; font-size: 0.8rem; color: #777; line-height: 1.6; word-break: break-all; }
  </style>
</head>
<body>
  <h1>App matching</h1>
  <p id="message">Loading…</p>

  <form id="panel" hidden>
    <p>Rank the topics by preference: move your favourite to the top with ↑ / ↓.</p>
    <ol id="items"></ol>
    <button type="submit" id="submit">Submit</button>
  </form>

  <div id="done" hidden>
    <p><strong>Keep your session id:</strong> you will need it to see the course you are assigned.</p>
    <code id="done-session"></code>
    <button type="button" id="copy">Copy session id</button>
    <a id="result-link" href="result.html">See my result</a>
  </div>

  <footer>
    <div id="session"></div>
    <div id="version"></div>
  </footer>

  <script src="config.js"></script>
  <script>
    const message = document.getElementById("message");
    const panel = document.getElementById("panel");
    const list = document.getElementById("items");
    let sessionId, items = [];

    async function errorText(res, fallback) {
      const { detail } = await res.json();
      return Array.isArray(detail) ? detail.map(d => d.msg).join("; ") : detail || fallback;
    }

    function show(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    function showVersion(res) {
      document.getElementById("version").textContent = "Version " + (res.headers.get("X-App-Version") || "?");
    }

    function move(i, delta) {
      [items[i], items[i + delta]] = [items[i + delta], items[i]];
      render();
    }

    function render() {
      list.innerHTML = "";
      items.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "item";
        li.innerHTML = `<b>${i + 1}</b>`
          + `<div><span class="label">${item.label}</span>`
          + `<span class="fact"><strong>${item.seats}%</strong> available seats</span>`
          + `<span class="fact">you have <strong>${item.points}</strong> points</span></div>`
          + `<div class="arrows"><button type="button" aria-label="Move up">↑</button>`
          + `<button type="button" aria-label="Move down">↓</button></div>`;
        const [up, down] = li.querySelectorAll("button");
        up.disabled = i === 0;
        down.disabled = i === items.length - 1;
        up.onclick = () => move(i, -1);
        down.onclick = () => move(i, 1);
        list.appendChild(li);
      });
    }

    async function init() {
      try {
        const res = await fetch(`${API_URL}/session/start`, { method: "POST" });
        showVersion(res);
        if (res.status === 403) return show("The panel is not active at the moment.");
        if (!res.ok) return show(await errorText(res, "Could not start a session."), true);
        const session = await res.json();
        sessionId = session.session_id;
        items = session.items;
        document.getElementById("session").textContent = "Session " + sessionId;
        render();
        show("");
        panel.hidden = false;
      } catch {
        show("The server cannot be reached.", true);
      }
    }

    panel.addEventListener("submit", async (event) => {
      event.preventDefault();
      const order = items.map((item, i) => `${i + 1}. ${item.label} (${item.seats}% seats, ${item.points} points)`).join("\n");
      if (!confirm(`Submit this ranking? This cannot be undone.\n\n${order}`)) return;
      try {
        const res = await fetch(`${API_URL}/session/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, items }),
        });
        if (!res.ok) return show(await errorText(res, "Submission failed."), true);
        panel.hidden = true;
        show("Thank you, your answers have been recorded.");
        document.getElementById("done-session").textContent = sessionId;
        document.getElementById("result-link").href = `result.html?session=${sessionId}`;
        document.getElementById("done").hidden = false;
      } catch {
        show("The server cannot be reached.", true);
      }
    });

    document.getElementById("copy").onclick = async (event) => {
      try {
        await navigator.clipboard.writeText(sessionId);
        event.target.textContent = "Copied!";
      } catch {
        event.target.textContent = "Copy failed: select the id above";
      }
    };

    init();
  </script>
</body>
</html>
